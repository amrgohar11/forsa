<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0A0C10" />
  <title>تسجيل دخول | FORSA</title>
  <link rel="icon" href="assets/logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at 30% 50%, rgba(23, 105, 255, 0.15), transparent 60%),
                  radial-gradient(circle at 70% 80%, rgba(184, 242, 58, 0.1), transparent 60%);
    }
    .login-card {
      background: var(--black-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 40px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-lg);
      position: relative;
      overflow: hidden;
    }
    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--lime), transparent);
      animation: login-shine 3s infinite;
    }
    @keyframes login-shine {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .login-logo {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-logo img {
      width: 80px;
      height: auto;
      margin-bottom: 12px;
      animation: logo-glow 3s ease-in-out infinite;
    }
    @keyframes logo-glow {
      0%, 100% { filter: drop-shadow(0 0 20px rgba(184, 242, 58, 0.3)); }
      50% { filter: drop-shadow(0 0 40px rgba(184, 242, 58, 0.6)); }
    }
    .login-logo h1 {
      font-size: 28px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--blue), var(--lime));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 3px;
      font-family: 'Montserrat', sans-serif;
    }
    .login-logo p {
      color: var(--gray);
      font-size: 14px;
      margin-top: 8px;
    }
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .login-form label {
      font-size: 13px;
      font-weight: 700;
      color: var(--gray-light);
      margin-bottom: -8px;
    }
    .login-form input {
      background: var(--black);
      border: 1px solid var(--border);
      color: var(--white);
      padding: 14px 16px;
      border-radius: 12px;
      font-family: 'Cairo', sans-serif;
      font-size: 15px;
      transition: var(--transition);
    }
    .login-form input:focus {
      outline: none;
      border-color: var(--lime);
      box-shadow: 0 0 0 3px rgba(184, 242, 58, 0.1);
    }
    .login-form button {
      background: linear-gradient(135deg, var(--blue), var(--lime));
      color: var(--black);
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      font-size: 16px;
      transition: var(--transition);
      margin-top: 8px;
      position: relative;
      overflow: hidden;
    }
    .login-form button::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.6s ease;
    }
    .login-form button:hover::after {
      left: 100%;
    }
    .login-form button:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lime);
    }
    .login-form button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .login-error {
      background: rgba(255, 68, 68, 0.1);
      border: 1px solid rgba(255, 68, 68, 0.3);
      color: var(--red);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
      display: none;
    }
    .login-error.show {
      display: block;
      animation: shake 0.4s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
    .login-back {
      text-align: center;
      margin-top: 20px;
    }
    .login-back a {
      color: var(--gray);
      text-decoration: none;
      font-size: 14px;
      transition: var(--transition);
    }
    .login-back a:hover {
      color: var(--lime);
    }
  </style>
</head>
<body>

  <!-- Custom Cursor -->
  <div class="custom-cursor" id="custom-cursor"></div>
  <div class="custom-cursor-outline" id="custom-cursor-outline"></div>

  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <img src="assets/logo.png" alt="FORSA" />
        <h1>FORSA</h1>
        <p>تسجيل دخول الأدمن</p>
      </div>

      <form class="login-form" id="login-form" onsubmit="handleLogin(event)">
        <label>الإيميل</label>
        <input type="email" id="login-email" placeholder="admin@forsa.eg" required />

        <label>الباسورد</label>
        <input type="password" id="login-password" placeholder="••••••••" required />

        <div class="login-error" id="login-error"></div>

        <button type="submit" id="login-btn">🔐 تسجيل الدخول</button>
      </form>

      <div class="login-back">
        <a href="index.html">← رجوع للموقع</a>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="firebase.js"></script>

  <script>
    // ========== LOGIN HANDLER ==========
    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;
      const errorEl = document.getElementById("login-error");
      const btn = document.getElementById("login-btn");

      errorEl.classList.remove("show");
      btn.disabled = true;
      btn.textContent = "⏳ جاري التحقق...";

      try {
        if (typeof firebase === "undefined") {
          throw new Error("Firebase SDK not loaded");
        }
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }

        const auth = firebase.auth();
        await auth.signInWithEmailAndPassword(email, password);

        window.location.href = "admin.html";
      } catch (err) {
        console.error(err);
        let msg = "حدث خطأ في تسجيل الدخول";
        if (err.code === "auth/user-not-found") msg = "الإيميل غير مسجل";
        else if (err.code === "auth/wrong-password") msg = "الباسورد غلط";
        else if (err.code === "auth/invalid-email") msg = "الإيميل غير صحيح";
        else if (err.code === "auth/invalid-credential") msg = "الإيميل أو الباسورد غلط";
        else if (err.code === "auth/too-many-requests") msg = "حاول تاني بعد شوية";
        else msg = err.message;

        errorEl.textContent = "❌ " + msg;
        errorEl.classList.add("show");
        btn.disabled = false;
        btn.textContent = "🔐 تسجيل الدخول";
      }
    }

    window.addEventListener("load", () => {
      if (typeof firebase === "undefined") return;
      if (!firebase.apps.length) {
        try { firebase.initializeApp(firebaseConfig); } catch (e) {}
      }
      try {
        const auth = firebase.auth();
        auth.onAuthStateChanged(user => {
          if (user) window.location.href = "admin.html";
        });
      } catch (e) {}
    });
  </script>

  <script src="animations.js"></script>
</body>
</html>
